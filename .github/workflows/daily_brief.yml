name: ETF Daily Brief

on:
  schedule:
    - cron: "0 11 * * 1-5"  # 7am ET (UTC-4 in summer) on weekdays
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send-brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ETF news agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python etf_news_agent.py

      - name: Save seen URLs
        run: |
          git config user.name "ETF News Bot"
          git config user.email "bot@github-actions.com"
          git pull --rebase --autostash
          git add daily_brief_seen.json
          git diff --staged --quiet || git commit -m "Update daily brief seen URLs [skip ci]"
          git push
