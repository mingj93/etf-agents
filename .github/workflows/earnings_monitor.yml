name: Quarterly Earnings Monitor

on:
  schedule:
    - cron: "0 15 * * 1-5"  # 11am ET on weekdays
  workflow_dispatch:

permissions:
  contents: write  # needed to commit the state file back

jobs:
  check-earnings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install anthropic requests

      - name: Run earnings monitor
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EARNINGS_SLACK_WEBHOOK_URL: ${{ secrets.EARNINGS_SLACK_WEBHOOK_URL }}
        run: python earnings_monitor.py

      - name: Save state
        run: |
          git config user.name "ETF Earnings Bot"
          git config user.email "bot@github-actions.com"
          git add processed_filings.json
          git diff --staged --quiet || git commit -m "Update processed filings state [skip ci]"
          git pull --rebase --autostash
          git push
